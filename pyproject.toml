[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bingart"
version = "1.5.1"
description = "bingart is an unofficial async API wrapper for Bing Image & Video Creator"
readme = "README.MD"
requires-python = ">=3.8,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Maehdadvan", email = "visitanimation@google.com" },
]
keywords = ["bing", "image-creator", "ai", "dall-e", "gpt4o", "async", "api-wrapper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "curl_cffi",
    "rookiepy",
]
urls = { Homepage = "https://github.com/DedInc/bingart", "Bug Tracker" = "https://github.com/DedInc/bingart/issues" }

[project.scripts]
bingart = "bingart.cli:main"

[dependency-groups]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["bingart"]
